name: Release

on:
    push:
        tags:
            - v*.*.*

permissions:
    contents: write
    packages: write
    security-events: write

env:
    REGISTRY: ghcr.io
    SERVER_IMAGE: ghcr.io/ninejuan/cv-server
    WEB_IMAGE: ghcr.io/ninejuan/cv-web

jobs:
    validate:
        name: Validate release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn test:server
            - run: yarn test:web
            - run: yarn audit

    build-and-push:
        name: Build and push images
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract tag
              id: version
              run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/server/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.tag }}
                      ${{ env.SERVER_IMAGE }}:latest
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/web/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.tag }}
                      ${{ env.WEB_IMAGE }}:latest

    security-scan:
        name: Trivy security scan
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - uses: aquasecurity/trivy-action@0.30.0
              with:
                  image-ref: ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
                  format: sarif
                  output: trivy-server.sarif
            - uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: trivy-server.sarif
            - uses: aquasecurity/trivy-action@0.30.0
              with:
                  image-ref: ${{ env.WEB_IMAGE }}:${{ github.ref_name }}
                  format: sarif
                  output: trivy-web.sarif
            - uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: trivy-web.sarif

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: [build-and-push, security-scan]
        steps:
            - uses: actions/checkout@v4
            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
