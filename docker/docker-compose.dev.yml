services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-postgres-dev
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cv}
      POSTGRES_USER: ${POSTGRES_USER:-cv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-47532}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cv_user} -d $${POSTGRES_DB:-cv}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cv-network

  redis:
    image: redis:7-alpine
    container_name: cv-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-47379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cv-network

  minio:
    image: minio/minio:latest
    container_name: cv-minio-dev
    env_file:
      - path: ../.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_SERVER_URL: http://localhost:${MINIO_PORT:-47900}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-47900}:9000"
      - "${MINIO_CONSOLE_PORT:-47901}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cv-network

  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile.dev
    container_name: cv-server-dev
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      APP_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-47900}
      API_INTERNAL_URL: http://server:3000
    volumes:
      - ../apps/server/src:/app/apps/server/src
      - ../apps/server/test:/app/apps/server/test
    ports:
      - "${APP_PORT:-47300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cv-network

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile.dev
    container_name: cv-web-dev
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      VITE_API_URL: ""
      API_INTERNAL_URL: http://server:3000
    volumes:
      - ../apps/web/app:/app/apps/web/app
      - ../apps/web/public:/app/apps/web/public
    ports:
      - "${WEB_PORT:-47173}:5173"
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
